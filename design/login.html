<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus · Sign in</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --amber: #f5a524;
    --amber-soft: #ffcf70;
    --ink: #0b0a09;
    --text: #f4ece0;
    --muted: #b7a890;
    --glass: rgba(18, 14, 10, .55);
    --line: rgba(255, 207, 112, .22);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--ink);
    display: grid; place-items: center;
    padding: 16px;
    overflow-x: hidden;
  }
  /* full-bleed owl eye, darkened with a vignette */
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background: url("owl-eye.jpg") center 40% / cover no-repeat;
    transform: scale(1.08);
    animation: drift 24s ease-in-out infinite alternate;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 0 18%, rgba(11,10,9,.75) 62%, var(--ink) 100%),
      linear-gradient(180deg, rgba(11,10,9,.55), rgba(11,10,9,.85));
  }
  @keyframes drift { to { transform: scale(1.16) translate(-1.5%, 1%); } }

  .card {
    width: min(100%, 400px);
    padding: 32px 28px 28px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 20px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(245,165,36,.12);
  }
  .logo {
    width: 84px; height: 84px; margin: -66px auto 18px; display: block;
    border-radius: 50%;
    border: 2px solid var(--amber);
    box-shadow: 0 0 0 6px rgba(245,165,36,.12), 0 0 40px rgba(245,165,36,.55);
    animation: glow 4s ease-in-out infinite;
  }
  @keyframes glow { 50% { box-shadow: 0 0 0 10px rgba(245,165,36,.08), 0 0 60px rgba(245,165,36,.8); } }
  h1 { text-align: center; font-size: 26px; letter-spacing: .3em; text-indent: .3em; font-weight: 600; }
  .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 26px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; letter-spacing: .04em; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,165,36,.25); }
  button {
    width: 100%; margin-top: 24px; padding: 13px; font: inherit; font-weight: 600;
    color: #1a1105; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, var(--amber-soft), var(--amber));
    box-shadow: 0 8px 24px rgba(245,165,36,.35);
    transition: transform .1s, filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  .foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .bg, .logo { animation: none; } }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="card">
    <img class="logo" src="icon-512.png" alt="Argus">
    <h1>ARGUS</h1>
    <p class="sub">The all-seeing log watcher</p>
    <form onsubmit="return false">
      <!-- Server URL is shown on native only; web uses same origin -->
      <label for="server">Server</label>
      <input id="server" type="url" placeholder="https://logs.example.com" autocomplete="url">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
    <p class="foot">Self-hosted · your logs stay yours</p>
  </main>
</body>
</html>
